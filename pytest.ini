[pytest]
# Маркеры набора add-kanban-core (tests/README.md — матрица кейс→тест).
# api      — API-тест (pytest + requests)
# must/should/could — приоритет MoSCoW из одобренного кейса
# manual   — НФТ-кейс, автоматизация нецелесообразна (процедура в docstring + README)
# web_ui   — UI-часть кейса: скоуп tests/web (браузерная проверка), здесь skip
markers =
    api: API-тест (requests)
    must: приоритет Must (MoSCoW кейса)
    should: приоритет Should (MoSCoW кейса)
    could: приоритет Could (MoSCoW кейса)
    manual: ручная НФТ-процедура (рестарт, осмотр БД)
    web_ui: UI-часть кейса — скоуп tests/web
testpaths = tests/api
