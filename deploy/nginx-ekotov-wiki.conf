# nginx: reverse-proxy + TLS Let's Encrypt для ekotov-wiki
# (задача 1.4, sdd.md §1 Front-proxy, design.md §8, NFR-6/NFR-7).
#
# Установка на VPS:
#   sudo cp deploy/nginx-ekotov-wiki.conf /etc/nginx/sites-available/ekotov-wiki
#   sudo ln -s /etc/nginx/sites-available/ekotov-wiki /etc/nginx/sites-enabled/
# До выпуска сертификата certbot'ом сначала раскомментируйте ТОЛЬКО 80-й блок,
# выпустите сертификат (deploy/README.md шаг 8), затем включите 443-й блок.
#
# ВАЖНО: заменить ekotov-wiki.example.com на реальный домен (2 места: оба server_name).

# --- HTTP: редирект на HTTPS + acme-challenge для certbot -------------------
server {
    listen 80;
    listen [::]:80;

    # ЗАМЕНИТЬ на домен (например, ekotov.example.com)
    server_name ekotov-wiki.example.com;

    # Webroot для Let's Encrypt (certbot --webroot -w /var/www/certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Остальной HTTP — только на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: основной сервер -------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # ЗАМЕНИТЬ на домен (как в 80-м блоке)
    server_name ekotov-wiki.example.com;

    # Сертификаты Let's Encrypt (создаются certbot'ом на VPS, в репозиторий
    # не попадают). Пути — стандартные для certbot.
    ssl_certificate     /etc/letsencrypt/live/ekotov-wiki.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ekotov-wiki.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Базовые security-заголовки (NFR-7). HSTS уместен только при TLS — здесь он есть.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Разумные таймауты (личная wiki: короткие запросы, никаких аплоадов)
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    client_max_body_size  2m;

    # Сжатие текстовой статики
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Статика веб-морды (когда появится, задача 3.x) — отдает nginx, не app.
    # Пока каталога нет, location не активен: файлы не раздаются.
    location /static/ {
        alias /opt/ekotov-wiki/frontend/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Все остальное — приложение (слушает только localhost)
    location / {
        proxy_pass http://127.0.0.1:8377;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
