# Compose-топология прода ekotov-wiki (P11 ЭТАП 1, change add-containerization).
#
# Источники: openspec/changes/add-containerization/design.md §1, §3, §6;
# план docs/ba/architecture-services-plan.md §5; ТЗ FR-65/66/73/74, NFR-9/11.
#
# ТОПОЛОГИЯ: app (uvicorn, порты НЕ публикуются — паритет 127.0.0.1:8377)
# + nginx (единственный публикует порт; TLS self-signed томом; avatars ro из тома).
# Данные (SQLite wiki.db + avatars/) — named volume wiki-data.
#
# ПЕРЕД ЗАПУСКОМ (однократно):
#   создать deploy/.env (chmod 600, НЕ коммитится — .gitignore):
#     SECRET_KEY=<тот же, что в /opt/ekotov-wiki/.env — иначе слетят сессии>
#   Порт публикации задается NGINX_PORT (дефолт 10443 = целевое состояние FR-65).
#   Переходная схема первого деплоя: NGINX_PORT=10444 (design §6 фаза 1) —
#   см. RUNBOOK §7.4.
#
# Образы: теги <release>, latest ЗАПРЕЩЕН (FR-72). ЭТАП 1 — сборка на VPS
# из клона (build: ниже); registry — ЭТАП 2+.

name: ekotov-wiki

services:
  app:
    image: ${APP_IMAGE:-ekotov-wiki/app:local}
    build:
      context: ..
      dockerfile: services/app/Dockerfile
    restart: unless-stopped
    # FR-73: app 512m (VPS 3.9 GB, резерв хосту >= 2 GB).
    mem_limit: 512m
    environment:
      # Секрет — только из deploy/.env (интерполяция compose); в репозиторий
      # не попадает (NFR-5). Паритет EnvironmentFile systemd-юнита.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY не задан — создайте deploy/.env (см. шапку)}
      DB_PATH: /data/wiki.db
      AVATARS_DIR: /data/avatars
    volumes:
      # FR-66: пользовательские данные — в named volume, в образ НЕ попадают.
      - wiki-data:/data
    # Healthcheck без curl (в python:3.12-slim его нет) — design §1.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8377/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Search-сервис (задача 1.2, add-microservices-full; design §1/§2/§7):
  # uvicorn :8378, БД — тот же named volume, НО маунт :ro — файловая гарантия
  # read-only (design §2; сервис ничего не пишет в общую БД).
  search:
    image: ${SEARCH_IMAGE:-ekotov-wiki/search:local}
    build:
      context: ..
      dockerfile: services/search/Dockerfile
    restart: unless-stopped
    # FR-73 паритет: search 512m (VPS 3.9 GB, резерв хосту >= 2 GB).
    mem_limit: 512m
    environment:
      # Путь БД — тот же файл, что у app (DB_PATH app'а; env-имя свое —
      # services/search/app/db.py).
      EKOTOV_WIKI_DB_PATH: /data/wiki.db
    volumes:
      # ГЛАВНАЯ ГАРАНТИЯ read-only: маунт тома в режиме ro (design §2).
      # wiki.db + WAL-файлы читает; schema/seed — зона app (init_db при
      # старте app применяет схему idempotent'но).
      - wiki-data:/data:ro
    # БЕЗ condition: service_healthy (design ТЗ: search читает БД независимо).
    # Образ БД с приложенной схемой должен СУЩЕСТВОВАТЬ к моменту запросов:
    # его создает app при первом старте (python -m app.db / init_db в app) —
    # на пустом томе search вернет 500 (sqlite создаст пустой файл только
    # при записи, а ro-маунт ее исключает; /api/health при этом 200).
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8378/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Sidecar-бэкап (задача 1.2; design §5): cron-цикл средствами python
  # (sqlite3 .backup + tar avatars), retention 14 дней. Релизный бэкап
  # deploy.sh (задача 1.4) вызывает ТОТ ЖЕ модуль — без дубля кода.
  backup:
    image: ${BACKUP_IMAGE:-ekotov-wiki/backup:local}
    build:
      context: ..
      dockerfile: services/backup/Dockerfile
    restart: unless-stopped
    # FR-73 паритет / design §7: backup 64m (пик при tar).
    mem_limit: 64m
    environment:
      EKOTOV_WIKI_DB_PATH: /data/wiki.db
      EKOTOV_WIKI_AVATARS_DIR: /data/avatars
      BACKUP_DIR: /backups
      # Суточный цикл; retention 14 дней (design §5).
      BACKUP_INTERVAL_SEC: "86400"
      BACKUP_RETENTION_DAYS: "14"
    volumes:
      # Данные — только чтение (безопасный профиль, plan §1.2 / README сервиса).
      - wiki-data:/data:ro
      # Каталог бэкапов — bind хоста (как у deploy.sh, design §5). Образ
      # работает под ЧИСЛОВЫМ uid 10001 (USER 10001 в Dockerfile) — bind-каталог
      # на хосте должен иметь владельца 10001:10001 (имя wiki:wiki на хосте
      # НЕ гарантирует этот uid — требуй именно числа). Права приводит
      # deploy/deploy.sh в шаге 1/8 (idempotent: stat %u, chown при отличии);
      # для свежего хоста вручную: mkdir -p + chown 10001:10001 (RUNBOOK §7).
      - /var/backups/ekotov-wiki:/backups
    # Sidecar вне цепочки запросов: depends_on нужен только чтобы БД
    # существовала к первому циклу; health — heartbeat-процесс (в образе).
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: ${FRONTEND_IMAGE:-ekotov-wiki/frontend:local}
    build:
      context: ..
      dockerfile: services/frontend/Dockerfile
    restart: unless-stopped
    # FR-73: nginx 64m.
    mem_limit: 64m
    depends_on:
      app:
        condition: service_healthy
    ports:
      # NFR-9/design §6: published-порт в env. Дефолт 10443 = целевое
      # состояние; первый контейнерный деплой — NGINX_PORT=10444 (фаза 1),
      # переключение — NGINX_PORT=10443 docker compose up -d (пересоздает
      # только nginx-контейнер).
      - "${NGINX_PORT:-10443}:10443"
    volumes:
      # FR-74: TLS self-signed до 2028-12-22, монтируется с хоста ro.
      - /etc/nginx/ssl/ekotov-wiki.crt:/etc/nginx/ssl/ekotov-wiki.crt:ro
      - /etc/nginx/ssl/ekotov-wiki.key:/etc/nginx/ssl/ekotov-wiki.key:ro
      # Аватары nginx отдает из того же тома, ro (design §1/§3).
      # Маунт ТОМ ЖЕ глубиной, что у app (том:/data), — иначе alias
      # /data/avatars/ резолвится в корень тома и мимо каталога
      # avatars/ (факт 2.3: 404 при непустом /avatars в томе).
      - wiki-data:/data:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wiki-data:
    # wiki.db + avatars/. Бэкап — сервис backup (sidecar, design §5):
    # суточный цикл внутри контейнера + релизный бэкап в deploy.sh (шаг 2/8),
    # оба — один модуль services/backup/backup.py.
