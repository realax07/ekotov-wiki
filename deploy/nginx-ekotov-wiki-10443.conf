# nginx: reverse-proxy + self-signed TLS для ekotov-wiki
# Развертывание на текущей машине: внешний порт 10443 (нестандартный —
# вне первых волн сканеров/ботов), приложение слушает только 127.0.0.1:8377.
# TLS self-signed: CN=194.58.34.122, SAN IP (см. /etc/nginx/ssl/).
# Домена нет → Let's Encrypt недоступен; при появлении домена заменить
# сертификат и server_name (вернуться к deploy/nginx-ekotov-wiki.conf).

server {
    listen 10443 ssl http2;
    listen [::]:10443 ssl http2;

    server_name 194.58.34.122;

    ssl_certificate     /etc/nginx/ssl/ekotov-wiki.crt;
    ssl_certificate_key /etc/nginx/ssl/ekotov-wiki.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security-заголовки (NFR-7). HSTS: браузер будет ходить только по TLS
    # (публикация «принять исключение» на self-signed происходит один раз).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Тихий отсев сканеров: /robots.txt ничего не разрешает
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    client_max_body_size  2m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias /opt/ekotov-wiki/frontend/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8377;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
