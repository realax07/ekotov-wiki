# Compose-стенд ekotov-wiki (P11 ЭТАП 1, change add-containerization).
#
# Источники: design.md §3 (строка «Стенд»), tasks.md 1.4; ТЗ FR-67, NFR-10.
#
# НАЗНАЧЕНИЕ: e2e-сьют (e2e/), репетиции миграций на копии прод-БД (tasks 2.1),
# паритет кодов ответов с монолитом (design §1 FR-64). Образы те же, что у
# прода (FR-67); файл АВТОНОМЕН — не мержится с compose.yaml.
#
# ПРЕДОСЛОВИЕ ПЕРЕД ПЕРВЫМ up (1.2-e, review-004-1.2): bind-каталог бэкапов
# обязан существовать и принадлежать uid 10001:10001 (образ backup работает
# под USER 10001) — иначе backup не сможет писать и останется unhealthy:
#   mkdir -p deploy/backups-test && chown 10001:10001 deploy/backups-test
#
# ТЕСТ-HTPASSWD для стенда (задача 1.3, add-netdata-monitoring): bind-mount
# deploy/netdata.htpasswd.test (артефакт вне git — deploy/.gitignore) в
# контейнер frontend. Файл создается один раз командой (пароль тестовый,
# ТОЛЬКО для стенда, в прод НЕ переносится — design §2):
#   printf 'qa-monitoring:%s\n' "$(openssl passwd -apr1 qa-test-only)" \
#     > deploy/netdata.htpasswd.test
# Креды стенда: qa-monitoring / qa-test-only (realm «Monitoring»).
#
# Отличия от прода (NFR-10 — изоляция от прода):
#   - ИМЕНОВАННЫЙ ТОМ ПРОЕКТА wiki-test-data (НЕ продовый wiki-data: проект
#     name: wiki-test дает собственное пространство томов — wiki-test-data
#     никогда не совпадает с продовым). Данные стенда исчезают при
#     `down -v` (см. Останов ниже);
#     ИЗМЕНЕНИЕ задачи 1.2 (add-microservices-full): раньше /data app был
#     tmpfs. tmpfs НЕ шарится между контейнерами, а в пакете появились
#     search (ro-читатель БД) и backup — на tmpfs они видели бы пустой /data:
#     search отдавал бы 500 (sqlite-схемы нет; sqlite3.connect на read-only
#     маунте пустой файл создать не может), backup — пустые бэкапы. Вариант
#     «каждому сервису свой tmpfs» отвергнут: данные должны быть ОДНИ.
#     Named volume проекта сохраняет обе гарантии: изоляцию от прода
#     (другое имя тома + отдельный проект compose) и общий /data для
#     app(RW)/search(RO)/backup(RO) — топология ~к проду.
#   - ДРУГОЙ порт публикации: 8443 (прод 10443, переходный 10444 — не заняты);
#   - seeded-юзеры (owner/wife) — заводятся командой после подъема;
#   - SECRET_KEY стенда — НЕ продовый (дефолт ниже, можно TEST_SECRET_KEY=...).
#
# Запуск (из корня клона; при необходимости соберет образы сам):
#   docker compose -f deploy/compose.test.yaml -p wiki-test up -d --build
#
# Seed (интерактивно, пароли с терминала — getpass, NFR-5):
#   docker compose -p wiki-test exec app python -m app.seed_users
#
# Проверка:
#   curl -s http://127.0.0.1:8443/api/health          # {"status":"ok"}
#   curl -k -o /dev/null -w '%{http_code}\n' https://127.0.0.1:8443/login   # 200
#
# Останов: docker compose -f deploy/compose.test.yaml -p wiki-test down -v
#   (-v ОБЯЗАТЕЛЕН: том wiki-test-data — не tmpfs, без -v данные стенда
#   переживают пересоздание контейнеров; свежий прогон = чистый том).

name: wiki-test

services:
  app:
    image: ${APP_IMAGE:-ekotov-wiki/app:local}
    build:
      context: ..
      dockerfile: services/app/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    environment:
      SECRET_KEY: ${TEST_SECRET_KEY:-00000000000000000000000000000000}
      DB_PATH: /data/wiki.db
      AVATARS_DIR: /data/avatars
    volumes:
      # Именованный том ПРОЕКТА wiki-test (не tmpfs — решение задачи 1.2,
      # см. шапку): app пишет (RW), search/backup читают (RO). Isolation от
      # прода — по имени проекта+тома; очистка — down -v (шапка).
      - wiki-test-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8377/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: ${FRONTEND_IMAGE:-ekotov-wiki/frontend:local}
    build:
      context: ..
      dockerfile: services/frontend/Dockerfile
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Контейнер внутри слушает 10443 (как в проде); наружу — 8443.
      - "${TEST_NGINX_PORT:-8443}:10443"
    volumes:
      # Тот же self-signed серт (CN=194.58.34.122, notAfter 2028-12-22);
      # клиенты e2e ходят с игнором валидации TLS.
      - /etc/nginx/ssl/ekotov-wiki.crt:/etc/nginx/ssl/ekotov-wiki.crt:ro
      - /etc/nginx/ssl/ekotov-wiki.key:/etc/nginx/ssl/ekotov-wiki.key:ro
      # Аватары: app теперь пишет в том же именованном томе проекта
      # (wiki-test-data:/data, не tmpfs) — nginx читает avatars из ТОГО ЖЕ
      # тома той же глубиной (/data), как в проде; e2e может гонять
      # аватар-контент (снимает компромисс rev.008 замечание 1).
      - wiki-test-data:/data:ro
      # Креды basic auth дашборда Netdata (задача 1.3): тест-htpasswd —
      # bind из каталога deploy (команда генерации и креды — в шапке файла);
      # qa-monitoring/qa-test-only, ТОЛЬКО стенд (изоляция от прода NFR-10).
      - ./netdata.htpasswd.test:/etc/nginx/netdata.htpasswd:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Search-сервис — те же параметры, что в проде (FR-67 паритет); том —
  # именованный том проекта wiki-test (изоляция от прода, см. шапку).
  search:
    image: ${SEARCH_IMAGE:-ekotov-wiki/search:test}
    build:
      context: ..
      dockerfile: services/search/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    environment:
      EKOTOV_WIKI_DB_PATH: /data/wiki.db
    volumes:
      - wiki-test-data:/data:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8378/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Sidecar-бэкап на стенде: цикл укорочен до 3600с (проверяемость на
  # стенде без суточного ожидания), retention тот же (14 дней). Каталог
  # бэкапов — bind проекта стенда (НЕ /var/backups хоста — изоляция NFR-10).
  backup:
    image: ${BACKUP_IMAGE:-ekotov-wiki/backup:test}
    build:
      context: ..
      dockerfile: services/backup/Dockerfile
    restart: unless-stopped
    mem_limit: 64m
    environment:
      EKOTOV_WIKI_DB_PATH: /data/wiki.db
      EKOTOV_WIKI_AVATARS_DIR: /data/avatars
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SEC: "3600"
      BACKUP_RETENTION_DAYS: "14"
    volumes:
      - wiki-test-data:/data:ro
      - ./backups-test:/backups
    depends_on:
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Netdata-мониторинг — те же параметры, что в проде (паритет топологии
  # NFR-10): метрики железа + контейнеров, порт НЕ публикуется, доступ к
  # дашборду — только через nginx (задача 1.3). docker.sock стенда — тот же
  # хост-сокет (метрики реальные, данные БД стенда не затрагиваются; design §5).
  netdata:
    image: ${NETDATA_IMAGE:-netdata/netdata:stable}
    restart: unless-stopped
    # NFR-19: netdata 256m (тот же лимит, что в проде — design §5).
    mem_limit: 256m
    environment:
      # Docker-коллектор (go.d): путь к сокету контейнеров (design §4).
      DOCKER_HOST: unix:///var/run/docker.sock
      DISABLE_TELEMETRY: "1"
    volumes:
      # Метрики железа хоста — строго ro (docs netdata docker).
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Контейнеры стека — docker-коллектор, строго ro (netdata НЕ управляет
      # контейнерами; design §4).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Healthcheck: curl по /api/v1/info (wget в Debian-based образе не
    # гарантирован; встроенный health.sh образа использует curl — ТЗ 1.2).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:19999/api/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Данные стенда (wiki.db + avatars/) — именованный том ПРОЕКТА wiki-test.
  # Фактическое имя в docker: wiki-test_wiki-test-data (пространство проекта
  # изолировано от продового ekotov-wiki_wiki-data — NFR-10).
  wiki-test-data:
