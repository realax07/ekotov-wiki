# ============================================================================
# qa-stand nginx — шаблон канонического контура регресса (P16).
# НЕ запускается напрямую: scripts/qa_stand_up.sh рендерит этот шаблон
# (подстановки @…@ — порты и пути стенда) в $STAND_DIR/nginx.conf и поднимает
# `nginx -c` с ним. Топология — паритет прода services/frontend/nginx/
# (REPORT-2.1 §1): static+avatars+images+videos — alias на каталоги стенда,
# app → @APP_PORT@, search → @SEARCH_PORT@, images → @IMAGES_PORT@,
# video → @VIDEO_PORT@, weather → @WEATHER_PORT@, слушает @NGINX_PORT@.
# Канонический контур и полный env прогона — tests/README.md.
# ============================================================================
worker_processes 1;
pid @STAND_DIR@/nginx.pid;
error_log @STAND_DIR@/nginx-error.log warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log @STAND_DIR@/nginx-access.log;
    client_body_temp_path @STAND_DIR@/nginx-body;
    proxy_temp_path @STAND_DIR@/nginx-proxy;

    client_max_body_size 520m;

    server {
        # M3 (review-001): бинд ТОЛЬКО loopback — стенд несет полное приложение
        # с каноническими тест-кредами из публичного репо; наружу (0.0.0.0)
        # его не отдаем, паритет с 127.0.0.1-биндом uvicorn-бэкендов. Тесты
        # ходят на localhost — топологии не вредит.
        listen 127.0.0.1:@NGINX_PORT@;
        server_name _;

        location /static/ {
            alias @REPO@/frontend/static/;
            expires 7d;
            add_header Cache-Control "public";
        }

        location /avatars/ {
            alias @STAND_DIR@/avatars/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # search-семейство (X-Service — паритет prod-headers.inc)
        location = /api/search {
            add_header X-Service "search" always;
            proxy_pass http://127.0.0.1:@SEARCH_PORT@;
        }
        location ^~ /api/search/ {
            add_header X-Service "search" always;
            proxy_pass http://127.0.0.1:@SEARCH_PORT@;
        }
        location = /api/suggestions {
            add_header X-Service "search" always;
            proxy_pass http://127.0.0.1:@SEARCH_PORT@;
        }
        location ^~ /api/suggestions/ {
            add_header X-Service "search" always;
            proxy_pass http://127.0.0.1:@SEARCH_PORT@;
        }

        # images-семейство (транспортный лимит 12m канонического стенда —
        # TC-GAL-108: 10 МБ режет сервис 422, 12 МиБ+обвязка — nginx 413)
        location = /api/images {
            add_header X-Service "images" always;
            client_max_body_size 12m;
            proxy_pass http://127.0.0.1:@IMAGES_PORT@;
        }
        location ^~ /api/images/ {
            add_header X-Service "images" always;
            client_max_body_size 12m;
            proxy_pass http://127.0.0.1:@IMAGES_PORT@;
        }

        location /images/ {
            alias @STAND_DIR@/images-data/;
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options nosniff always;
        }

        # video-семейство (лимит загрузки — как в проде, 520m)
        location = /api/videos {
            add_header X-Service "video" always;
            client_max_body_size 520m;
            proxy_pass http://127.0.0.1:@VIDEO_PORT@;
        }
        location ^~ /api/videos/ {
            add_header X-Service "video" always;
            client_max_body_size 520m;
            proxy_pass http://127.0.0.1:@VIDEO_PORT@;
        }

        location /videos/ {
            auth_request /_video_auth;
            error_page 401 = @login_redirect;
            error_page 500 502 503 504 = @videos_down;
            alias @STAND_DIR@/videos-data/;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /_video_auth {
            internal;
            proxy_pass http://127.0.0.1:@VIDEO_PORT@/api/videos/authcheck;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Real-IP $remote_addr;
        }

        location @login_redirect {
            internal;
            return 302 /login;
        }

        location @videos_down {
            internal;
            default_type application/json;
            add_header Retry-After "5" always;
            return 503 '{"error": "video service unavailable"}';
        }

        # weather-семейство (паритет прод weather-proxy.inc: intercept off +
        # error_page 502 504 = @weather_down; страница /weather — ядро app)
        location = /api/weather {
            add_header X-Service "weather" always;
            proxy_next_upstream error timeout;
            proxy_intercept_errors off;
            error_page 502 504 = @weather_down;
            proxy_pass http://127.0.0.1:@WEATHER_PORT@;
        }
        location ^~ /api/weather/ {
            add_header X-Service "weather" always;
            proxy_next_upstream error timeout;
            proxy_intercept_errors off;
            error_page 502 504 = @weather_down;
            proxy_pass http://127.0.0.1:@WEATHER_PORT@;
        }
        location @weather_down {
            internal;
            default_type application/json;
            add_header Retry-After "5" always;
            return 503 '{"error": "weather service unavailable"}';
        }

        # Всё остальное — ядро app
        location / {
            proxy_pass http://127.0.0.1:@APP_PORT@;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
