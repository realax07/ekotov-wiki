<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Галерея — ekotov-wiki</title>
  <!-- Мобильный вариант V1 «Таб-бар»: masonry 2 колонки, чипы-фильтры горизонтальным скроллом,
       лайтбокс на весь экран. Канон направления A. -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <style>
    .appbar { position: sticky; top: 0; z-index: 20; padding: 0 var(--space-3);
      background: var(--color-bg); border-bottom: 1px solid var(--color-border); }
    .appbar-row { display: flex; align-items: center; gap: var(--space-3); }
    .brand { display: inline-flex; align-items: center; min-height: 48px;
      font-family: var(--font-display); font-weight: 700; font-size: var(--text-lg);
      color: var(--color-text); text-decoration: none; }
    main { padding: var(--space-3) var(--space-3) calc(84px + env(safe-area-inset-bottom)); }
    main h1 { font-size: var(--text-xl); }
    .sub { margin: var(--space-1) 0 var(--space-3); font-size: var(--text-sm); color: var(--color-muted); }

    /* Фильтры горизонтальным скроллом */
    .filters { display: flex; gap: var(--space-2); overflow-x: auto; padding-bottom: var(--space-2);
      margin: 0 calc(-1 * var(--space-3)) var(--space-3); padding-left: var(--space-3); padding-right: var(--space-3);
      scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter-chip { display: inline-flex; align-items: center; gap: var(--space-2); flex: none; min-height: 40px;
      padding: 0 var(--space-3); border-radius: var(--radius-pill); border: 1px solid var(--color-border);
      background: var(--color-surface); color: var(--color-muted); font-family: var(--font-ui);
      font-size: var(--text-sm); font-weight: 500; cursor: pointer; line-height: 1; }
    .filter-chip:active { transform: translateY(1px); }
    .filter-chip[aria-pressed="true"] { background: var(--color-accent); color: var(--color-on-accent); border-color: transparent; }
    .filter-chip .count { font-family: var(--font-mono); font-size: var(--text-xs); line-height: 1; opacity: .8; }

    /* Masonry: 2 колонки, естественная высота плиток */
    .masonry { columns: 2; column-gap: var(--space-3); }
    .shot { display: block; width: 100%; margin: 0 0 var(--space-3); padding: 0; text-align: left;
      background: none; border: 0; cursor: pointer; break-inside: avoid; }
    .shot .ph { --ph-ratio: auto; aspect-ratio: var(--shot-ratio, 4 / 3); border-style: solid;
      transition: transform var(--dur) var(--ease), border-color var(--dur) var(--ease); }
    .shot:active .ph { transform: scale(.99); border-color: var(--color-accent-2); }
    .shot-name { display: block; font-family: var(--font-ui); font-weight: 500; font-size: var(--text-sm);
      color: var(--color-text); margin-top: var(--space-1); }
    .shot-meta { display: block; font-family: var(--font-mono); font-size: var(--text-xs);
      color: var(--color-muted); font-variant-numeric: tabular-nums; }

    /* Лайтбокс на весь экран */
    .lb { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-rows: auto 1fr auto;
      background: var(--color-bg); padding: var(--space-2) var(--space-3) max(var(--space-4), env(safe-area-inset-bottom)); gap: var(--space-2); }
    .lb-head { display: flex; align-items: center; gap: var(--space-2); min-height: 44px; }
    .lb-head h2 { font-size: var(--text-md); margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .icon-btn { display: inline-flex; align-items: center; justify-content: center;
      min-width: 44px; min-height: 44px; background: none; border: 0; margin-left: auto;
      border-radius: var(--radius-sm); color: var(--color-muted); cursor: pointer; text-decoration: none; flex: none; }
    .icon-btn:hover { color: var(--color-text); }
    .icon-btn svg { width: 20px; height: 20px; }
    .lb .ph { width: 100%; height: 100%; aspect-ratio: auto; }
    .lb-actions { display: flex; gap: var(--space-2); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); flex: 1;
      min-height: 48px; min-width: 44px; padding: 0 var(--space-3); border-radius: var(--radius-sm);
      border: 1px solid transparent; font-family: var(--font-ui); font-size: var(--text-md); font-weight: 600;
      text-decoration: none; cursor: pointer; }
    .btn-primary { background: var(--color-accent); color: var(--color-on-accent); }
    .btn-secondary { background: transparent; color: var(--color-text); border-color: var(--color-accent-2); }

    /* Нижний таб-бар */
    .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      display: grid; grid-template-columns: repeat(5, 1fr);
      background: var(--color-surface); border-top: 1px solid var(--color-border);
      padding: var(--space-1) 0 max(env(safe-area-inset-bottom), var(--space-1)); }
    .tab-item { display: grid; justify-items: center; gap: 2px; min-height: 56px; padding: var(--space-1) 0;
      background: none; border: 0; text-decoration: none; cursor: pointer;
      font-family: var(--font-ui); font-size: var(--text-xs); color: var(--color-muted); line-height: 1; }
    .tab-item svg { width: 22px; height: 22px; }
    .tab-item:hover { color: var(--color-text); }
    .tab-item[aria-current="page"] { color: var(--color-accent); font-weight: 600; }

    /* Шторка «Ещё» */
    .sheet-backdrop { position: fixed; inset: 0; z-index: 40; background: var(--color-bg); opacity: .7; border: 0; padding: 0; }
    .sheet-more { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; margin: 0;
      background: var(--color-surface); border: 1px solid var(--color-border); border-bottom: 0;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-2);
      padding: var(--space-2) var(--space-3) calc(var(--space-4) + env(safe-area-inset-bottom)); display: grid; gap: var(--space-2); }
    .grab { width: 40px; height: 4px; border-radius: var(--radius-pill); background: var(--color-border); margin: var(--space-1) auto var(--space-2); }
    .sheet-head { display: flex; align-items: center; min-height: 44px; }
    .sheet-head h2 { font-size: var(--text-lg); }
    .more-row { display: flex; align-items: center; gap: var(--space-3); min-height: 48px;
      border: 0; background: none; text-align: left; text-decoration: none; cursor: pointer;
      font-family: var(--font-ui); font-size: var(--text-md); color: var(--color-text);
      border-radius: var(--radius-sm); padding: 0 var(--space-2); }
    .more-row:hover { background: var(--color-raised); }
    .more-row svg { width: 20px; height: 20px; color: var(--color-muted); flex: none; }
    .more-row .switch { margin-left: auto; }
    .switch { appearance: none; width: 40px; height: 24px; border-radius: var(--radius-pill);
      background: var(--color-border); position: relative; cursor: pointer; margin: 0;
      transition: background-color var(--dur) var(--ease); flex: none; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
      border-radius: 50%; background: var(--color-surface); transition: transform var(--dur) var(--ease); }
    .switch:checked { background: var(--color-accent); }
    .switch:checked::after { transform: translateX(16px); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="appbar-row">
      <a class="brand" href="board.html">ekotov-wiki</a>
      <button class="icon-btn" type="button" aria-haspopup="dialog" onclick="openMore()" aria-label="Меню и тема" style="margin-left:auto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <h1>Галерея</h1>
    <p class="sub">24 файла · 118 МБ</p>

    <div class="filters" aria-label="Фильтры">
      <button class="filter-chip" type="button" aria-pressed="true">Все <span class="count">24</span></button>
      <button class="filter-chip" type="button" aria-pressed="false">Скриншоты <span class="count">9</span></button>
      <button class="filter-chip" type="button" aria-pressed="false">Мокапы <span class="count">6</span></button>
      <button class="filter-chip" type="button" aria-pressed="false">Диаграммы <span class="count">5</span></button>
      <button class="filter-chip" type="button" aria-pressed="false">Баннеры <span class="count">4</span></button>
    </div>

    <div class="masonry">
      <button class="shot" type="button" style="--shot-ratio: 4 / 3" onclick="openLb(this)">
        <span class="ph" role="img" aria-label="Скриншот: доска задач, тёмная тема">1440×900</span>
        <span class="shot-name">Доска, тёмная тема</span>
        <span class="shot-meta">PNG · 412 КБ</span>
      </button>
      <button class="shot" type="button" style="--shot-ratio: 3 / 4" onclick="openLb(this)">
        <span class="ph" role="img" aria-label="Мокап: мобильная доска 390px">390×844</span>
        <span class="shot-name">Мокап доски, 390px</span>
        <span class="shot-meta">PNG · 286 КБ</span>
      </button>
      <button class="shot" type="button" style="--shot-ratio: 1 / 1" onclick="openLb(this)">
        <span class="ph" role="img" aria-label="Схема: ворота конвейера flowctl">1024×1024</span>
        <span class="shot-name">Ворота flowctl</span>
        <span class="shot-meta">SVG · 41 КБ</span>
      </button>
      <button class="shot" type="button" style="--shot-ratio: 16 / 9" onclick="openLb(this)">
        <span class="ph" role="img" aria-label="Скриншот: чтение статьи в wiki">1440×810</span>
        <span class="shot-name">Статья в режиме чтения</span>
        <span class="shot-meta">PNG · 365 КБ</span>
      </button>
      <button class="shot" type="button" style="--shot-ratio: 2 / 3" onclick="openLb(this)">
        <span class="ph" role="img" aria-label="Баннер: релиз редизайна">900×1350</span>
        <span class="shot-name">Баннер релиза</span>
        <span class="shot-meta">PNG · 528 КБ</span>
      </button>
      <button class="shot" type="button" style="--shot-ratio: 4 / 3" onclick="openLb(this)">
        <span class="ph" role="img" aria-label="Скриншот: галерея, masonry-сетка">1440×900</span>
        <span class="shot-name">Галерея, сетка</span>
        <span class="shot-meta">PNG · 391 КБ</span>
      </button>
    </div>
  </main>

  <!-- Лайтбокс -->
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-labelledby="lb-title" hidden>
    <div class="lb-head">
      <h2 id="lb-title">Мокап доски, 390px</h2>
      <span class="badge" style="display:inline-flex;align-items:center;min-height:24px;padding:0 var(--space-2);border-radius:var(--radius-sm);font-family:var(--font-ui);font-size:var(--text-xs);font-weight:500;background:var(--color-raised);color:var(--color-muted);border:1px solid var(--color-border)">390×844</span>
      <button class="icon-btn" type="button" aria-label="Закрыть просмотр" onclick="closeLb()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <span class="ph" id="lb-img" role="img" aria-label="Просмотр файла">390×844</span>
    <div class="lb-actions">
      <button class="btn btn-primary" type="button">Скачать</button>
      <button class="btn btn-secondary" type="button">Поделиться</button>
    </div>
  </div>

  <nav class="tabbar" aria-label="Разделы">
    <a class="tab-item" href="board.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg>
      <span>Доска</span>
    </a>
    <a class="tab-item" href="wiki.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M9 8h7M9 12h5"/></svg>
      <span>Wiki</span>
    </a>
    <a class="tab-item" href="gallery.html" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="9.5" r="1.6"/><path d="M3.5 17.5 9 12.5l3.5 3 3.5-4 4.5 5"/></svg>
      <span>Галерея</span>
    </a>
    <a class="tab-item" href="video.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 9.5v5l4.5-2.5Z"/></svg>
      <span>Видео</span>
    </a>
    <button class="tab-item" type="button" aria-haspopup="dialog" onclick="openMore()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
      <span>Ещё</span>
    </button>
  </nav>

  <button class="sheet-backdrop" id="backdrop" type="button" aria-label="Закрыть меню" hidden onclick="closeMore()"></button>
  <div class="sheet-more" id="more" role="dialog" aria-modal="true" aria-labelledby="more-title" hidden>
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-head"><h2 id="more-title">Ещё</h2></div>
    <button class="more-row" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.2 3.9-5 7-5s5.8 1.8 7 5"/></svg>
      Профиль
    </button>
    <label class="more-row" for="theme-switch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      Светлая тема
      <input class="switch" type="checkbox" role="switch" id="theme-switch" onchange="toggleTheme(this)">
    </label>
    <a class="more-row" href="board.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      Настройки досок
    </a>
    <a class="more-row" href="wiki.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v10m0 0 4-4m-4 4-4-4M5 20h14"/></svg>
      Экспорт данных
    </a>
  </div>

  <script>
    function openLb(shot) {
      var name = shot.querySelector(".shot-name").textContent;
      var size = shot.querySelector(".shot-meta").textContent.split(" · ")[0];
      document.getElementById("lb-title").textContent = name;
      document.getElementById("lb-img").textContent = shot.querySelector(".ph").textContent;
      document.getElementById("lb").hidden = false;
    }
    function closeLb() { document.getElementById("lb").hidden = true; }
    function openMore() { document.getElementById("more").hidden = false; document.getElementById("backdrop").hidden = false; }
    function closeMore() { document.getElementById("more").hidden = true; document.getElementById("backdrop").hidden = true; }
    function toggleTheme(sw) {
      var r = document.documentElement;
      if (sw.checked) { r.dataset.theme = "light"; } else { delete r.dataset.theme; }
    }
  </script>
</body>
</html>
