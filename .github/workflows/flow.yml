name: test-flow-control

on:
  push:
    branches: [main, "pipeline/**"]
  pull_request:

jobs:
  # Ворота конвейера (J65.7): flow_check и pr_validate исполняются из
  # checkout'а фабрики на factory.lock-SHA. Проектные гейты (auth timing,
  # codegraph I3) — те же копии из checkout'а фабрики.
  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (J64.17: по SHA)

      # J65.7: проект подключает ворота фабрики по закрепленной версии —
      # factory.lock в корне (repo=<owner/name>, sha=<40 hex>). CI делает
      # checkout фабрики на этот SHA в .factory/ и гоняет ЕЕ flow_check и
      # pr_validate против проекта; обновление ворот = PR с одной строкой sha.
      - name: Factory lock (J65.7)
        id: lock
        run: |
          if [ -f factory.lock ]; then
            BAD=$(grep -vE '^(#.*|[[:space:]]*|repo=[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+|sha=[0-9a-f]{40})$' factory.lock || true)
            NREPO=$(grep -cE '^repo=' factory.lock || true)
            NSHA=$(grep -cE '^sha=' factory.lock || true)
            if [ -n "$BAD" ] || [ "$NREPO" != "1" ] || [ "$NSHA" != "1" ]; then
              echo "::error::factory.lock: нужны ровно по одной строке repo=<owner/name> и sha=<40 hex>"
              exit 1
            fi
            SHA=$(sed -n 's/^sha=//p' factory.lock)
            REPO=$(sed -n 's/^repo=//p' factory.lock)
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "repo=$REPO" >> "$GITHUB_OUTPUT"
            echo "FACTORY_SCRIPTS=.factory/scripts" >> "$GITHUB_ENV"
            echo "AI_FACTORY_HOME=$GITHUB_WORKSPACE/.factory" >> "$GITHUB_ENV"
          else
            echo "FACTORY_SCRIPTS=scripts" >> "$GITHUB_ENV"
          fi

      - name: Checkout factory at lock (J65.7)
        if: steps.lock.outputs.sha != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (J64.17: по SHA)
        with:
          repository: ${{ steps.lock.outputs.repo }}
          ref: ${{ steps.lock.outputs.sha }}
          path: .factory
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4 (J64.17: по SHA)
        with:
          node-version: 22

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.14.0  # пин: @latest (>=1.15) поднял WARNING >500 chars до фейла strict

      - name: Validate specs (strict)
        run: openspec validate --all --strict

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (J64.17: по SHA)
        with:
          python-version: "3.12"

      - name: Flow check
        run: python3 "$FACTORY_SCRIPTS/flow_check.py" .

      # Детерминированные код-гейты (J4, решение Заказчика 2026-10-04):
      # auth-тайминг (bcrypt/dummy/сравнения секретов) + codegraph (I3-покрытие
      # импортов). Быстрые, stdlib-only, детерминированные — ломаются только
      # при реальном нарушении.
      - name: Auth timing gate
        run: python3 "$FACTORY_SCRIPTS/check_auth_timing.py" backend

      - name: Codegraph gate (I3)
        run: python3 "$FACTORY_SCRIPTS/codegraph.py" .

      # pm_bounds_check (J9/J10) НЕ в CI: гейт проверяет ПМ-коммиты против
      # реестра сессий (~/.hermes/state), которого в CI нет — консервативная
      # ветка сочтет все коммиты ПМ-скими (ложный FAIL). Гейт гоняется
      # локально при приемке.

      - name: PR artifact validation (I3/I4, J6; code-review gate J10; J50 UI-gate)
        if: github.event_name == 'pull_request'
        run: |
          PR_TEXT="$(cat "$GITHUB_EVENT_PATH" | python3 -c "import json,sys; d=json.load(sys.stdin); pr=d.get('pull_request',{}); print(pr.get('title','')+' '+(pr.get('body') or ''))")"
          # J10: PR по change-маркеру обязан иметь code-reviews/<change-id>/ с
          # approve-вердиктами задач из дифа — проверяет pr_validate.py (check_change).
          # Контекст диффа для [chore]/[docs]/[ops]-чекеров (env-конвенция pr_validate).
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep '^openspec/changes/' | grep -vq '^openspec/changes/archive/'; then
            export PR_CHANGED_SPECS=1
          fi
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qE '^(backend|frontend|services|src|e2e)/'; then
            export PR_CHANGED_CODE=1
          fi
          # Н15 (АУД 2026-10-23): J26 deploy-гейт — флаг изменения deploy/** для pr_validate
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qE '^(deploy/|RUNBOOK\.md$)'; then
            export PR_CHANGED_DEPLOY=1
          fi
          # J50: UI-дельта и web-тесты в дифе — ворота «UI-дельта + макеты
          # (design/**) ⇒ web-тесты или [no-ui-tests] + основание».
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qE '^(frontend/|services/[^/]+/frontend/)'; then
            export PR_CHANGED_UI=1
          fi
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qE '^tests/web/.*\.py$'; then
            export PR_CHANGED_WEBTESTS=1
          fi
          if ! python3 "$FACTORY_SCRIPTS/pr_validate.py" . --id "$PR_TEXT"; then
            echo "::error::pr_validate: обязательные артефакты отсутствуют (см. выше)"
            exit 1
          fi

      # J42 (L2): push сабагентской ветки pipeline/** без открытого PR —
      # падающий шаг — детерминированный сигнал ПМ: ветка не прошла ворота.
      - name: Push gate — pipeline/** без открытого PR (J42)
        if: github.event_name == 'push' && startsWith(github.ref_name, 'pipeline/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ github.ref_name }}"
          OPEN_PRS=$(gh pr list --head "$BRANCH" --state open --json number --jq length)
          if [ "$OPEN_PRS" = "0" ]; then
            echo "::error::сабагентская ветка $BRANCH не прошла ворота — открой PR"
            exit 1
          fi

  # J66: автотесты по слоям (unit → api → integration → web). tests/unit и
  # tests/integration стендонезависимы; tests/api требует канонический контур
  # (scripts/qa_stand_up.sh: nginx → app+search+images+video+weather).
  # tests/web (playwright) — полный стенд: в CI web-слой покрывает job e2e
  # (playwright против compose-стенда, те же образы, что у прода); полная
  # серия tests/web через qa_stand_up.sh — локальный регресс (tests/README.md).
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (J64.17: по SHA)

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 (J64.17: по SHA)
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          # pytest-playwright (0.9.0 = venv wiki): корневой conftest.py проекта
          # регистрирует плагин глобально (pytest>=8 — только root conftest),
          # без него любой pytest из корня падает на импорте плагина; в
          # backend/requirements.txt его нет (backend/ не трогаем).
          pip install -r backend/requirements.txt pytest-playwright==0.9.0

      # Слой 1: unit (стендонезависимы; GITHUB_EVENT_PATH удаляется —
      # pr_validate/gate_runner трактуют его как PR-контекст).
      - name: Unit tests (tests/unit)
        run: env -u GITHUB_EVENT_PATH python -m pytest tests/unit -q

      # Слой 2+3: api + integration против канонического контура
      # qa_stand_up.sh (nginx ставится на раннер; ffmpeg предустановлен на
      # образе раннера, PATH=/usr/bin перекрывает машинозависимый FFMPEG_DIR).
      - name: Install nginx (stand)
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx

      - name: Stand up (qa_stand_up.sh)
        run: |
          # PY — абсолютный путь: [ -x python ] в скрипте PATH не резолвит
          PY="$(command -v python)" STAND_DIR=/tmp/qa-stand FFMPEG_DIR=/usr/bin \
            bash scripts/qa_stand_up.sh reset

      - name: API + integration tests (tests/api, tests/integration)
        run: |
          EKOTOV_WIKI_BASE_URL=http://127.0.0.1:18443 \
          EKOTOV_WIKI_DB_PATH=/tmp/qa-stand/app.db \
          EKOTOV_WIKI_AVATARS_DIR=/tmp/qa-stand/avatars \
          EKOTOV_WIKI_IMAGES_DIR=/tmp/qa-stand/images-data \
          env -u GITHUB_EVENT_PATH python -m pytest tests/api tests/integration -q

      - name: Tear down stand
        if: always()
        run: PY="$(command -v python)" STAND_DIR=/tmp/qa-stand bash scripts/qa_stand_up.sh stop || true

  # e2e против compose-стенда (change add-containerization, tasks 1.7; FR-69).
  # Только ДОБАВЛЕНИЕ job: существующие job'ы не переименованы (required
  # checks синхронны с именами job — урок конвейера).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Install playwright browser
        run: python -m playwright install --with-deps chromium

      # Стенд: те же образы, что у прода (FR-67); TLS-серт для стенда —
      # self-signed генерируется на шаге (в репозитории ключей нет, NFR-5).
      - name: Generate self-signed cert for stand
        run: |
          mkdir -p /tmp/ekotov-ssl
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/ekotov-ssl/ekotov-wiki.key \
            -out /tmp/ekotov-ssl/ekotov-wiki.crt -days 30 -nodes \
            -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

      # TLS-серт стенда: compose.test.yaml монтирует /etc/nginx/ssl/* хоста
      # (паритет с продом по путям); в CI путь не существует — создаем symlink
      # на серт, сгенерированный предыдущим шагом (нужен root — контейнер
      # раннера его дает).
      - name: Place stand certificate
        run: |
          sudo mkdir -p /etc/nginx/ssl
          sudo cp /tmp/ekotov-ssl/ekotov-wiki.crt /etc/nginx/ssl/
          sudo cp /tmp/ekotov-ssl/ekotov-wiki.key /etc/nginx/ssl/
          # nginx-unprivileged (uid 101) читает ключ: world-readable для self-signed
          # стенда CI (ключ тестовый, живет 30 дней, генерируется на раннере);
          # на проде права дает хост (RUNBOOK §7).
          sudo chmod 644 /etc/nginx/ssl/ekotov-wiki.crt /etc/nginx/ssl/ekotov-wiki.key

      - name: Start compose test stand
        run: |
          # J37-инфра: netdata из Docker Hub упирается в анонимный pull rate limit
          # раннеров (netdata/netdata:stable, IP-пул GitHub). Для e2e netdata —
          # заглушка: frontend-образ (nginx) слушает 19999 (healthcheck-маршрут
          # compose = 200 на «/» у nginx → 404, но healthcheck только для
          # depends_on-гейта, UI-тесты проверяют ЛИНК /netdata/, не дашборд).
          # Реальный netdata остаётся дефолтом compose.yaml (прод/ручные прогоны).
          docker tag ekotov-wiki/frontend:p14-responsive-2 netdata-stub:local 2>/dev/null || \
            docker build -t netdata-stub:local -f services/frontend/Dockerfile .
          export NETDATA_IMAGE=netdata-stub:local
          docker compose -f deploy/compose.test.yaml -p wiki-test up -d --build
        shell: bash

      # Схема БД до seed (init_db идемпотентен; tmpfs-том стенда пуст при первом up).
      - name: Init database schema
        run: |
          docker compose -f deploy/compose.test.yaml -p wiki-test exec -T app \
            python -m app.db

      - name: Seed owner user
        run: |
          docker compose -f deploy/compose.test.yaml -p wiki-test exec -T app \
            python -c "from app.seed_users import seed_user; print(seed_user('owner', 'owner', 'QaOwner_Pass_1!'))" \
            || echo "seed skip (уже заведен)"

      - name: Wait for stand healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sk -o /dev/null https://127.0.0.1:8443/api/health; then
              echo "stand ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::стенд не поднялся за 120s"; docker compose -p wiki-test logs; exit 1

      - name: Run e2e suite
        env:
          EKOTOV_WIKI_E2E_BASE_URL: https://127.0.0.1:8443
        run: python -m pytest e2e -v

      # Логи стенда при падении сьюта (диагностика 500/timeout без второго прогона).
      - name: Dump stand logs on failure
        if: failure()
        run: docker compose -f deploy/compose.test.yaml -p wiki-test logs --tail 100

      - name: Tear down stand
        if: always()
        run: docker compose -f deploy/compose.test.yaml -p wiki-test down -v
