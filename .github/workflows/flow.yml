name: test-flow-control

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@latest

      - name: Validate specs (strict)
        run: openspec validate --all --strict

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Flow check
        run: python3 scripts/flow_check.py .

      - name: PR artifact validation (I3/I4, J6; code-review gate J10)
        if: github.event_name == 'pull_request'
        run: |
          PR_TEXT="$(cat "$GITHUB_EVENT_PATH" | python3 -c "import json,sys; d=json.load(sys.stdin); pr=d.get('pull_request',{}); print(pr.get('title','')+' '+(pr.get('body') or ''))")"
          # J10: PR по change-маркеру обязан иметь code-reviews/<change-id>/ с
          # approve-вердиктами задач из дифа — проверяет pr_validate.py (check_change).
          # Задачи берутся из ветки PR (GITHUB_HEAD_REF) и title/body.
          if ! python3 scripts/pr_validate.py . --id "$PR_TEXT"; then
            echo "::error::pr_validate: обязательные артефакты отсутствуют (см. выше)"
            exit 1
          fi

  # e2e против compose-стенда (change add-containerization, tasks 1.7; FR-69).
  # Только ДОБАВЛЕНИЕ job: существующие job'ы не переименованы (required
  # checks синхронны с именами job — урок конвейера).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Install playwright browser
        run: python -m playwright install --with-deps chromium

      # Стенд: те же образы, что у прода (FR-67); TLS-серт для стенда —
      # self-signed генерируется на шаге (в репозитории ключей нет, NFR-5).
      - name: Generate self-signed cert for stand
        run: |
          mkdir -p /tmp/ekotov-ssl
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/ekotov-ssl/ekotov-wiki.key \
            -out /tmp/ekotov-ssl/ekotov-wiki.crt -days 30 -nodes \
            -subj "/CN=127.0.0.1" -addext "subjectAltName=IP:127.0.0.1"

      # TLS-серт стенда: compose.test.yaml монтирует /etc/nginx/ssl/* хоста
      # (паритет с продом по путям); в CI путь не существует — создаем symlink
      # на серт, сгенерированный предыдущим шагом (нужен root — контейнер
      # раннера его дает).
      - name: Place stand certificate
        run: |
          sudo mkdir -p /etc/nginx/ssl
          sudo cp /tmp/ekotov-ssl/ekotov-wiki.crt /etc/nginx/ssl/
          sudo cp /tmp/ekotov-ssl/ekotov-wiki.key /etc/nginx/ssl/
          # nginx-unprivileged (uid 101) читает ключ: world-readable для self-signed
          # стенда CI (ключ тестовый, живет 30 дней, генерируется на раннере);
          # на проде права дает хост (RUNBOOK §7).
          sudo chmod 644 /etc/nginx/ssl/ekotov-wiki.crt /etc/nginx/ssl/ekotov-wiki.key

      - name: Start compose test stand
        run: |
          docker compose -f deploy/compose.test.yaml -p wiki-test up -d --build
        shell: bash

      # Схема БД до seed (init_db идемпотентен; tmpfs-том стенда пуст при первом up).
      - name: Init database schema
        run: |
          docker compose -f deploy/compose.test.yaml -p wiki-test exec -T app \
            python -m app.db

      - name: Seed owner user
        run: |
          docker compose -f deploy/compose.test.yaml -p wiki-test exec -T app \
            python -c "from app.seed_users import seed_user; print(seed_user('owner', 'owner', 'QaOwner_Pass_1!'))" \
            || echo "seed skip (уже заведен)"

      - name: Wait for stand healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sk -o /dev/null https://127.0.0.1:8443/api/health; then
              echo "stand ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::стенд не поднялся за 120s"; docker compose -p wiki-test logs; exit 1

      - name: Run e2e suite
        env:
          EKOTOV_WIKI_E2E_BASE_URL: https://127.0.0.1:8443
        run: python -m pytest e2e -v

      # Логи стенда при падении сьюта (диагностика 500/timeout без второго прогона).
      - name: Dump stand logs on failure
        if: failure()
        run: docker compose -f deploy/compose.test.yaml -p wiki-test logs --tail 100

      - name: Tear down stand
        if: always()
        run: docker compose -f deploy/compose.test.yaml -p wiki-test down -v
