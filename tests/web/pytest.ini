[pytest]
# Конфиг web-сьюта E2E-G1: маркеры кейсов TC-UI-001…018 (tests/web/README-секция).
# pytest.ini в корне репозитория задает testpaths=tests/api — web-сьют запускается
# указанием пути: pytest tests/web; собственные маркеры — здесь (e2e, web).
markers =
    e2e: сквозной E2E-тест (Playwright, tests/web)
    web: браузерный тест (Playwright) — скоуп tests/web
    must: приоритет Must (MoSCoW кейса)
    should: приоритет Should (MoSCoW кейса)
    could: приоритет Could (MoSCoW кейса)
