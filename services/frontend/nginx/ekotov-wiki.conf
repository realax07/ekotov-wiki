# nginx-конфиг контейнерного образа ekotov-wiki/frontend
# (change add-containerization, tasks 1.2; design §1–2).
#
# База: deploy/nginx-ekotov-wiki-10443.conf (systemd-период). Отличия образа:
#   - upstream app:8377 через ПЕРЕМЕННУЮ + resolver 127.0.0.11 valid=10s —
#     против stale-DNS 502 при пересоздании только app-контейнера (design §1);
#   - статика — из образа (/srv/static, скопирована Dockerfile'ом);
#   - avatars — named volume (ro-маунт wiki-data:/data/avatars);
#   - TLS — bind-mount /etc/nginx/ssl/* (ro), тот же self-signed серт.
# Пути pid/tmp/cache — unprivileged-базовый образ (uid 101, /tmp).

server {
    # Внутренний порт контейнера; публикуемый порт задает compose
    # (${NGINX_PORT:-10443}:10443 — design §6).
    listen 10443 ssl;
    listen [::]:10443 ssl http2;

    server_name _;

    ssl_certificate     /etc/nginx/ssl/ekotov-wiki.crt;
    ssl_certificate_key /etc/nginx/ssl/ekotov-wiki.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security-заголовки (NFR-7) — паритет прод-конфига.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Тихий отсев сканеров (паритет прод-конфига).
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    client_max_body_size  2m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Статика — из образа (design §2); кеш 7d — паритет прод-конфига (FR-69:
    # e2e проверяет `expires 7d`).
    location /static/ {
        alias /srv/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Аватары — named volume wiki-data (ro-маунт /data/avatars), FR-66;
    # кеш-бастинг ?v=<avatar_updated_at> — как в проде.
    location /avatars/ {
        alias /data/avatars/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Stale-DNS (design §1): docker compose up -d с новым образом app
    # пересоздает app, но НЕ nginx — закешированный на старте IP дал бы 502.
    # resolver + переменная в proxy_pass заставляют nginx переразрешать
    # app:8377 (127.0.0.11 — DNS docker compose-сети, valid=10s).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream_app http://app:8377;
        proxy_pass $upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
