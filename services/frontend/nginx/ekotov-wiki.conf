# ekotov-wiki.conf — nginx-конфиг контейнерного образа ekotov-wiki/frontend
# (change add-containerization, tasks 1.2; design §1–2; задача 1.3
# add-microservices-full — маршрутизация search-семейства; задача 1.3
# add-netdata-monitoring — локации /netdata с basic auth).
#
# База: deploy/nginx-ekotov-wiki-10443.conf (systemd-период). Отличия образа:
#   - upstream app:8377 через ПЕРЕМЕННУЮ + resolver 127.0.0.11 valid=10s —
#     против stale-DNS 502 при пересоздании только app-контейнера (design §1);
#   - upstream search:8378 для /api/search*, /api/suggestions — так же через
#     переменную (задача 1.3: nginx не должен падать при старте без
#     search-контейнера; resolver переразрешает имя с valid=10s); прокси и
#     заголовки search-локаций — include search-proxy.inc / search-headers.inc;
#   - статика — из образа (/srv/static, скопирована Dockerfile'ом);
#   - avatars — named volume (ro-маунт wiki-data:/data/avatars);
#   - TLS — bind-mount /etc/nginx/ssl/* (ro), тот же self-signed серт.
# Пути pid/tmp/cache — unprivileged-базовый образ (uid 101, /tmp).

server {
    # Внутренний порт контейнера; публикуемый порт задает compose
    # (${NGINX_PORT:-10443}:10443 — design §6).
    listen 10443 ssl;
    listen [::]:10443 ssl http2;

    server_name _;

    ssl_certificate     /etc/nginx/ssl/ekotov-wiki.crt;
    ssl_certificate_key /etc/nginx/ssl/ekotov-wiki.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security-заголовки (NFR-7) — паритет прод-конфига.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Тихий отсев сканеров (паритет прод-конфига).
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    client_max_body_size  2m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Статика — из образа (design §2); кеш 7d — паритет прод-конфига (FR-69:
    # e2e проверяет `expires 7d`).
    location /static/ {
        alias /srv/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Аватары — named volume wiki-data (ro-маунт /data/avatars), FR-66;
    # кеш-бастинг ?v=<avatar_updated_at> — как в проде.
    location /avatars/ {
        alias /data/avatars/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Stale-DNS (design §1; задача 1.3 — то же для search): docker compose up -d
    # с новым образом app (или search) пересоздает контейнер, но НЕ nginx —
    # закешированный на старте IP дал бы 502. resolver + переменная в proxy_pass
    # заставляют nginx переразрешать имена (127.0.0.11 — DNS docker compose-сети,
    # valid=10s). Старт nginx без search-контейнера безопасен: имя не
    # резолвится на старте, только на запросах.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ------------------------------------------------------------------
    # Search-семейство (задача 1.3; design §1/§4) → search:8378.
    #
    # Точность матчей (ТЗ 1.3): роутеры сервиса — @router.get("") на
    # /api/search и /api/suggestions + вложенные /api/search/advanced (POST)
    # и /api/suggestions/users. Пара «= точный + ^~ префикс-слэш» на КАЖДОМ
    # семействе:
    #   - = /api/search      — сам поиск (и префикс-локация /api/search без
    #                          слэша НЕ съела бы /api/searchX посторонний —
    #                          nginx матчит префикс по границе сегмента, но
    #                          точный локация дешевле и явнее);
    #   - ^~ /api/search/    — вложенные (advanced; будущие) — покрывает
    #                          ТЗ-требование «/api/search покрывает
    #                          /api/search/advanced»;
    #   - = /api/suggestions — подсказки;
    #   - ^~ /api/suggestions/ — /api/suggestions/users: префиксная локация
    #                          /api/suggestions НЕ должна ловить этот путь.
    # ^~ отключает регэксп-проверки — семейство не перебивается будущими
    # regex-локациями. Прокси (переменная + URI как есть) — include
    # search-proxy.inc; URI не переписывается — search-роутеры видят свои
    # пути как в монолите (контракт contracts/openapi-search.json).
    location = /api/search {
        include /etc/nginx/conf.d/search-headers.inc;
        include /etc/nginx/conf.d/search-proxy.inc;
    }

    location ^~ /api/search/ {
        include /etc/nginx/conf.d/search-headers.inc;
        include /etc/nginx/conf.d/search-proxy.inc;
    }

    location = /api/suggestions {
        include /etc/nginx/conf.d/search-headers.inc;
        include /etc/nginx/conf.d/search-proxy.inc;
    }

    location ^~ /api/suggestions/ {
        include /etc/nginx/conf.d/search-headers.inc;
        include /etc/nginx/conf.d/search-proxy.inc;
    }

    # ------------------------------------------------------------------
    # Images-семейство (задача 1.4 add-gallery-service; design §1/§4) →
    # images:8379. Та же пара «= точный + ^~ префикс-слэш», что у search:
    #   - = /api/images    — upload (POST multipart) и список (GET);
    #   - ^~ /api/images/  — вложенные: /{id}, /{id}/like|dislike,
    #                        /{id}/comments, /api/health сервиса images.
    # ^~ отключает регэксп-проверки — семейство не перебивается будущими
    # regex-локациями. Прокси (переменная $upstream_images + URI как есть)
    # — include images-proxy.inc; заголовки — images-headers.inc.
    # Healthcheck образа frontend (wget /api/health) попадает в ^~-локацию
    # и обслуживается images — требование ТЗ «/api/health images через
    # nginx 200».
    location = /api/images {
        include /etc/nginx/conf.d/images-headers.inc;
        include /etc/nginx/conf.d/images-proxy.inc;
    }

    location ^~ /api/images/ {
        include /etc/nginx/conf.d/images-headers.inc;
        include /etc/nginx/conf.d/images-proxy.inc;
    }

    # Файлы галереи (оригинал + превью) — named volume images-data
    # (ro-маунт /data/images в compose, задача 1.4); кеш 7d — паритет
    # /avatars/ (design §1/§4; gallery: «Отдача файла nginx из тома» —
    # сервис images в отдаче не участвует). Путь alias'а = маунт-точка
    # тома: filenames кладутся сервисом в корень images-data
    # (app/gallery.py: orig_path = images_dir/<filename>).
    location /images/ {
        alias /data/images/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }

    # Деградация (design §4): остановленный/отвалившийся images → быстрый
    # управляемый 503 клиенту (не 502-залипание, не таймаут) — паттерн
    # @search_down; error_page 502 503 504 назначает images-proxy.inc.
    location @images_down {
        internal;
        default_type application/json;
        include /etc/nginx/conf.d/images-headers.inc;
        add_header Retry-After "5" always;
        return 503 '{"error": "images service unavailable"}';
    }

    # Деградация (design §4): остановленный/отвалившийся search → быстрый
    # управляемый 503 клиенту (не 502-залипание, не таймаут).
    location @search_down {
        internal;
        default_type application/json;
        include /etc/nginx/conf.d/search-headers.inc;
        add_header Retry-After "5" always;
        return 503 '{"error": "search service unavailable"}';
    }

    # ------------------------------------------------------------------
    # Netdata-семейство (задача 1.3, add-netdata-monitoring; design §1/§2;
    # spec monitoring: «Netdata не публикуется наружу напрямую», «Доступ к
    # дашборду — только учетка owner через nginx»). Дашборд Netdata требует
    # trailing slash — точная локация «= /netdata» отдает 301 на /netdata/
    # (официальный паттерн Netdata subpath); сам 301 НЕ аутентифицируется —
    # как только слэш на месте, включается basic auth ниже.
    #
    # Пара «= /netdata/» + «^~ /netdata/» — по образцу search-семейства:
    #   - = /netdata/  — сам дашборд (точная локация дешевле и явнее);
    #   - ^~ /netdata/ — assets и API-вызовы дашборда; префикс-слэш НЕ
    #                    съедает /netdataX посторонние (граница сегмента),
    #                    а «^~» отключает regex-проверки — семейство не
    #                    перебивается будущими regex-локациями.
    # В обеих локациях auth_basic ДО прокси: без валидных кредов ни один
    # запрос до netdata не доходит (401, ОВ-2; spec monitoring). Файл
    # /etc/nginx/netdata.htpasswd — bind-mount ro с хоста (compose; в
    # репозиторий не попадает — deploy/.gitignore; пароль отдельный от
    # пароля wiki-owner — design §2).
    #
    # add_header не наследуется в локацию с собственным add_header —
    # security-набор (NFR-7) повторен в netdata-headers.inc (урок Р6).
    # Прокси с вырезанием префикса (named capture + $ndpath$is_args$args,
    # resolver 127.0.0.11 + переменная $netdata_upstream — анти-stale-DNS,
    # паритет app/search) — include netdata-proxy.inc.
    location = /netdata {
        return 301 /netdata/;
    }

    location = /netdata/ {
        auth_basic           "Monitoring";
        auth_basic_user_file /etc/nginx/netdata.htpasswd;
        include /etc/nginx/conf.d/netdata-headers.inc;
        include /etc/nginx/conf.d/netdata-proxy.inc;
    }

    location ^~ /netdata/ {
        auth_basic           "Monitoring";
        auth_basic_user_file /etc/nginx/netdata.htpasswd;
        include /etc/nginx/conf.d/netdata-headers.inc;
        include /etc/nginx/conf.d/netdata-proxy.inc;
    }

    # ------------------------------------------------------------------
    # Video-семейство (задача 1.4 video-hosting; design §1/§5/§6) →
    # video:8380. Та же пара «= точный + ^~ префикс-слэш», что у search/
    # images: URI не переписывается, ^~ отключает регэксп-проверки.
    #   - = /api/videos    — upload (POST multipart, лимит 520m из
    #                        videos-proxy.inc) и список (GET);
    #   - ^~ /api/videos/  — вложенные: /{id}, /{id}/file, /{id}/preview,
    #                        /api/videos/authcheck, /api/health сервиса video.
    # Прокси (переменная $upstream_videos + URI как есть) — include
    # videos-proxy.inc; заголовки — videos-headers.inc.
    location = /api/videos {
        include /etc/nginx/conf.d/videos-headers.inc;
        include /etc/nginx/conf.d/videos-proxy.inc;
    }

    location ^~ /api/videos/ {
        include /etc/nginx/conf.d/videos-headers.inc;
        include /etc/nginx/conf.d/videos-proxy.inc;
    }

    # ------------------------------------------------------------------
    # Weather-семейство (change weather-service; design §1/§5) →
    # weather:8381. Та же пара «= точный + ^~ префикс-слэш», что у
    # search/images/videos: URI не переписывается, ^~ отключает
    # регэксп-проверки. ТОЛЬКО API-семейство: страницы /weather в nginx
    # НЕТ — рендерится ядром app (ревью №1 F3, design §7); auth_request
    # НЕ используется (сессию проверяет middleware сервиса — 401 JSON,
    # паритет API-локаций video).
    #   - = /api/weather  — данные погоды (GET, контракт design §6);
    #   - ^~ /api/weather/ — вложенные: /api/health сервиса weather.
    # Прокси (переменная $upstream_weather + URI как есть) — include
    # weather-proxy.inc; заголовки — weather-headers.inc. КЛЮЧЕВОЕ
    # отличие от видео: intercept OFF (ревью №1 F1-в) — честный 503
    # weather_unavailable живого сервиса доходит до клиента без
    # подмены; отказ соединения ловит error_page 502 504 = @weather_down.
    location = /api/weather {
        include /etc/nginx/conf.d/weather-headers.inc;
        include /etc/nginx/conf.d/weather-proxy.inc;
    }

    location ^~ /api/weather/ {
        include /etc/nginx/conf.d/weather-headers.inc;
        include /etc/nginx/conf.d/weather-proxy.inc;
    }

    # Прокси game-portal (P26; PRODUCT_BACKLOG.md «P26. Интеграция game-portal»):
    # внешний игровой хаб — standalone-контейнер ВНЕ compose
    # (docker run --network ekotov-wiki-par_default …, порт 8080 внутри;
    # поднимает ПМ — RUNBOOK §9). Локейшны:
    #   - = /games            — 301 на /games/ (хаб ожидает trailing slash);
    #   - ^~ /games/api/      — API хаба, срез префикса (games-proxy.inc):
    #                           бэкенду /api/games;
    #   - ^~ /games/previews/ — превью, срез префикса: бэкенду
    #                           /previews/<id>.png;
    #   - ~ ^/games/(munchkin|vice|poker|tanks|durak|evolution)(/|$)
    #                         — СТРАНИЦЫ ИГР (БАГ-5, review-002): хаб роутит
    #                           их НАТИВНО (server.mjs: ^/games/([^/]+)…), —
    #                           префикс НЕ вырезается (games-proxy-game.inc).
    #                           id захардкожены — осознанный компромисс:
    #                           обобщить нельзя (hub-статика корня тоже
    #                           выглядит как /games/<файл>); новая игра хаба
    #                           = строка здесь. Соответствие id → папка:
    #                           munchkin=Manchkin/public, vice=GTA/dist, evolution=evolution,
    #                           poker=Poker/velvet-poker/dist,
    #                           tanks=Tanks/tanki/dist, durak=Durak;
    #   - /games/             — прочее (корень хаба /, его статика
    #                           style.css/app.js), срез префикса.
    # КЛЮЧЕВОЕ (порядок выбора локейшнов nginx): точный > префикс с «^~»
    # (regex НЕ проверяются) > regex (по порядку в конфиге) > обычный
    # префикс. Поэтому strip-локейшн /games/ — ОБЫЧНЫЙ префикс (НЕ «^~»,
    # как было): иначе он глотал бы regex-локейшн страниц игр и БАГ-5
    # оставался бы. Префикс-слэш НЕ съедает /gamesX посторонние (граница
    # сегмента).
    # Переменная $upstream_games — анти-stale-DNS, паритет netdata/weather.
    # sub_filter абсолютных путей хаба (href/src/fetch) — include
    # games-proxy.inc; заголовки — games-headers.inc. AUTH НЕ заводим
    # (P26 ТЗ): хаб открыт всем авторизованным в сети.
    location = /games {
        return 301 /games/;
    }

    location ^~ /games/api/ {
        include /etc/nginx/conf.d/games-headers.inc;
        include /etc/nginx/conf.d/games-proxy.inc;
    }

    location ^~ /games/previews/ {
        include /etc/nginx/conf.d/games-headers.inc;
        include /etc/nginx/conf.d/games-proxy.inc;
    }

    location ~ ^/games/(munchkin|vice|poker|tanks|durak|evolution)(/|$) {
        include /etc/nginx/conf.d/games-headers.inc;
        include /etc/nginx/conf.d/games-proxy-game.inc;
    }

    location /games/ {
        include /etc/nginx/conf.d/games-headers.inc;
        include /etc/nginx/conf.d/games-proxy.inc;
    }

    # Файлы видео (оригинал/mp4/превью) — named volume videos-data
    # (ro-маунт /data/videos в compose, задача 1.4; design §5). КЛЮЧЕВОЕ
    # отличие от /images/ (NFR-36/ОВ-2 — публичных ссылок НЕТ): отдача
    # только после auth_request → video /api/videos/authcheck (200/401
    # по cookie subrequest'а).
    #   - error_page 401 = @login_redirect — без сессии файл не отдается,
    #     браузер уходит на /login (паритет поведению страниц ядра);
    #   - error_page 500 502 503 504 = @videos_down — отказ authcheck
    #     (video down) — управляемая 503, НЕ голый 500 (устранение F2,
    #     design §5/§6). Нюанс nginx: модуль auth_request превращает любой
    #     неожиданный статус subrequest'а (502/504) в ошибку 500 ОСНОВНОГО
    #     запроса («auth request unexpected status»), поэтому локация
    #     перехватывает и 500. Кроме auth-стыка в /videos/ динамики нет
    #     (отдача файлов — 200/403/404), так что 500 здесь возможен только
    #     как «сервис недоступен».
    #   - Range-запросы <video> и кеш обрабатывает nginx (design §5) —
    #     expires не задаем (файлы большие, кеширование не ТЗ).
    location /videos/ {
        auth_request /_video_auth;
        error_page 401 = @login_redirect;
        error_page 500 502 503 504 = @videos_down;
        alias /data/videos/;
        add_header X-Content-Type-Options nosniff always;
    }

    # Auth-стык для auth_request (internal): subrequest → video
    # /api/videos/authcheck. Тело не пересылается (задача 1.4):
    # proxy_pass_request_body off + пустой Content-Length —
    # каноничный паттерн nginx auth_request.
    location = /_video_auth {
        internal;
        set $upstream_videos http://video:8380;
        proxy_pass $upstream_videos/api/videos/authcheck;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Без сессии файл /videos/* — редирект на страницу входа (design §5;
    # паритет поведению страниц ядра, middleware app → /login).
    location @login_redirect {
        internal;
        return 302 /login;
    }

    # Деградация (design §1/§6): остановленный/отвалившийся video → быстрый
    # управляемый 503 клиенту (не 502-залипание, не таймаут) — паттерн
    # @images_down/@search_down; error_page 502 503 504 назначают
    # videos-proxy.inc И локация /videos/.
    location @videos_down {
        internal;
        default_type application/json;
        include /etc/nginx/conf.d/videos-headers.inc;
        add_header Retry-After "5" always;
        return 503 '{"error": "video service unavailable"}';
    }

    # Деградация weather (change weather-service, design §5): остановленный/
    # отвалившийся weather → быстрый управляемый 503 клиенту (не 502-залипание,
    # не таймаут) — паттерн @videos_down; error_page 502 504 назначает
    # weather-proxy.inc (503 в error_page НЕ назначается — честный 503
    # weather_unavailable живого сервиса проходит без подмены, intercept off).
    location @weather_down {
        internal;
        default_type application/json;
        include /etc/nginx/conf.d/weather-headers.inc;
        add_header Retry-After "5" always;
        return 503 '{"error": "weather service unavailable"}';
    }

    # Всё остальное (/, /api/* кроме search-семейства, страницы Jinja2) —
    # ядро app:8377 (design §1). X-Service на app-ответах в образе НЕ
    # заведен (проверено при задаче 1.3) — нового не добавляем.
    location / {
        set $upstream_app http://app:8377;
        proxy_pass $upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
