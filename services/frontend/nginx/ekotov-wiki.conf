# nginx-конфиг контейнерного образа ekotov-wiki/frontend
# (change add-containerization, tasks 1.2; design §1–2; задача 1.3
# add-microservices-full — маршрутизация search-семейства).
#
# База: deploy/nginx-ekotov-wiki-10443.conf (systemd-период). Отличия образа:
#   - upstream app:8377 через ПЕРЕМЕННУЮ + resolver 127.0.0.11 valid=10s —
#     против stale-DNS 502 при пересоздании только app-контейнера (design §1);
#   - upstream search:8378 для /api/search*, /api/suggestions — так же через
#     переменную (задача 1.3: nginx не должен падать при старте без
#     search-контейнера; resolver переразрешает имя с valid=10s); прокси и
#     заголовки search-локаций — include search-proxy.inc / search-headers.inc;
#   - статика — из образа (/srv/static, скопирована Dockerfile'ом);
#   - avatars — named volume (ro-маунт wiki-data:/data/avatars);
#   - TLS — bind-mount /etc/nginx/ssl/* (ro), тот же self-signed серт.
# Пути pid/tmp/cache — unprivileged-базовый образ (uid 101, /tmp).

server {
    # Внутренний порт контейнера; публикуемый порт задает compose
    # (${NGINX_PORT:-10443}:10443 — design §6).
    listen 10443 ssl;
    listen [::]:10443 ssl http2;

    server_name _;

    ssl_certificate     /etc/nginx/ssl/ekotov-wiki.crt;
    ssl_certificate_key /etc/nginx/ssl/ekotov-wiki.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security-заголовки (NFR-7) — паритет прод-конфига.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Тихий отсев сканеров (паритет прод-конфига).
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    client_max_body_size  2m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Статика — из образа (design §2); кеш 7d — паритет прод-конфига (FR-69:
    # e2e проверяет `expires 7d`).
    location /static/ {
        alias /srv/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Аватары — named volume wiki-data (ro-маунт /data/avatars), FR-66;
    # кеш-бастинг ?v=<avatar_updated_at> — как в проде.
    location /avatars/ {
        alias /data/avatars/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Stale-DNS (design §1; задача 1.3 — то же для search): docker compose up -d
    # с новым образом app (или search) пересоздает контейнер, но НЕ nginx —
    # закешированный на старте IP дал бы 502. resolver + переменная в proxy_pass
    # заставляют nginx переразрешать имена (127.0.0.11 — DNS docker compose-сети,
    # valid=10s). Старт nginx без search-контейнера безопасен: имя не
    # резолвится на старте, только на запросах.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ------------------------------------------------------------------
    # Search-семейство (задача 1.3; design §1/§4) → search:8378.
    #
    # Точность матчей (ТЗ 1.3): роутеры сервиса — @router.get("") на
    # /api/search и /api/suggestions + вложенные /api/search/advanced (POST)
    # и /api/suggestions/users. Пара «= точный + ^~ префикс-слэш» на КАЖДОМ
    # семействе:
    #   - = /api/search      — сам поиск (и префикс-локация /api/search без
    #                          слэша НЕ съела бы /api/searchX посторонний —
    #                          nginx матчит префикс по границе сегмента, но
    #                          точный локация дешевле и явнее);
    #   - ^~ /api/search/    — вложенные (advanced; будущие) — покрывает
    #                          ТЗ-требование «/api/search покрывает
    #                          /api/search/advanced»;
    #   - = /api/suggestions — подсказки;
    #   - ^~ /api/suggestions/ — /api/suggestions/users: префиксная локация
    #                          /api/suggestions НЕ должна ловить этот путь.
    # ^~ отключает регэксп-проверки — семейство не перебивается будущими
    # regex-локациями. Прокси (переменная + URI как есть) — include
    # search-proxy.inc; URI не переписывается — search-роутеры видят свои
    # пути как в монолите (контракт contracts/openapi-search.json).
    location = /api/search {
        include /etc/nginx/conf.d/search-headers.inc;
        include /etc/nginx/conf.d/search-proxy.inc;
    }

    location ^~ /api/search/ {
        include /etc/nginx/conf.d/search-headers.inc;
        include /etc/nginx/conf.d/search-proxy.inc;
    }

    location = /api/suggestions {
        include /etc/nginx/conf.d/search-headers.inc;
        include /etc/nginx/conf.d/search-proxy.inc;
    }

    location ^~ /api/suggestions/ {
        include /etc/nginx/conf.d/search-headers.inc;
        include /etc/nginx/conf.d/search-proxy.inc;
    }

    # Деградация (design §4): остановленный/отвалившийся search → быстрый
    # управляемый 503 клиенту (не 502-залипание, не таймаут).
    location @search_down {
        internal;
        default_type application/json;
        include /etc/nginx/conf.d/search-headers.inc;
        add_header Retry-After "5" always;
        return 503 '{"error": "search service unavailable"}';
    }

    # Всё остальное (/, /api/* кроме search-семейства, страницы Jinja2) —
    # ядро app:8377 (design §1). X-Service на app-ответах в образе НЕ
    # заведен (проверено при задаче 1.3) — нового не добавляем.
    location / {
        set $upstream_app http://app:8377;
        proxy_pass $upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
