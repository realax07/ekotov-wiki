<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход</title>
  <link rel="stylesheet" href="/static/css/login.css?v={{ static_v }}">
</head>
<body>
  <main class="login-box">
    <h1>Вход</h1>
    <form id="login-form" method="post" action="/api/auth/login">
      <label for="login">Логин</label>
      <input type="text" id="login" name="login" autocomplete="username" autofocus required>

      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <button type="submit" id="login-submit">Войти</button>
      {# DEF-001 (FR-35, 5.2): текст ошибки входа — дефолт из JS (единый
         «Неверный логин или пароль», NFR-7); при 401 контрольного
         /api/auth/me после 200 логина JS подставляет сообщение
         «Откройте сайт по https://…» ( Secure-кука не сохранилась). #}
      <p id="login-error" class="login-error" role="alert" hidden>Неверный логин или пароль</p>
    </form>
  </main>
  <script src="/static/js/login.js?v={{ static_v }}"></script>
</body>
</html>
