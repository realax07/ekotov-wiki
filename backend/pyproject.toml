[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE"]
ignore = [
    "B008",  # FastAPI Depends() в дефолтных аргументах — идиома фреймворка
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]  # в тестах допустимы широкие except
